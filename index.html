<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hybrid Demo - Pages</title>
  <style>
    body { font-family: system-ui; max-width: 600px; margin: 60px auto; padding: 20px; background: #0d1117; color: #c9d1d9; }
    h1 { color: #f38020; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; }

  </style>
</head>
<body>
  <h1>⚡ Hybrid Demo <span class="badge pages">PAGES</span></h1>
  <p>当前通过 <code>pages.dev</code> 静态托管访问</p>
  <div class="card">
    <p>状态: <span class="ok">部署成功 ✓</span></p>
    <p>同一份代码也能通过 Worker 方式部署，提供动态 API 功能。</p>
  </div>
  <p style="color: #8b949e; font-size: 12px;">部署时间: <script>document.write(new Date().toLocaleString());</script></p>
